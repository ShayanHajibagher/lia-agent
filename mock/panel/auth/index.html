<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — پنل لیارا (جعلی)</title>
<link rel="stylesheet" href="/mock/assets/panel.css">
<script defer src="/mock/assets/panel.js"></script>
<script defer src="/widget/lia.js"></script>
</head>
<body><div class="auth-wrap"><div class="card auth-card pad-lg">
      <div class="brand" style="border:0;padding:0 0 14px"><span class="logo">ل</span> لیارا</div>
      <h1 style="font-size:19px;margin-bottom:6px">ورود به حساب کاربری</h1>
      <p class="lead" style="margin-bottom:18px">برای ساخت برنامه و مدیریت سرویس‌ها وارد شوید.</p>
      <form onsubmit="event.preventDefault();location.href='/panel/apps/'">
        <div class="field">
          <label for="email">ایمیل</label>
          <input id="email" type="email" placeholder="you@example.com" dir="ltr" required>
        </div>
        <div class="field">
          <label for="password">گذرواژه</label>
          <input id="password" type="password" placeholder="••••••••" dir="ltr" required>
        </div>
        <button class="btn" type="submit" style="width:100%;justify-content:center">ورود</button>
      </form>
      <p class="lead" style="margin-top:14px;font-size:12px">این صفحه شبیه‌سازی است؛ هر ایمیل/گذرواژه‌ای پذیرفته می‌شود.</p>
    </div></div></body>
</html>
